services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-video_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-video_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_pipeline}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_pipeline} -d ${POSTGRES_DB:-video_pipeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATA_DIR: /data
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_pipeline:video_pipeline@postgres:5432/video_pipeline}
      SECRETS_FILE: /run/secrets/video-pipeline/.env.local
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets/video-pipeline:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATA_DIR: /data
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://video_pipeline:video_pipeline@postgres:5432/video_pipeline}
      SECRETS_FILE: /run/secrets/video-pipeline/.env.local
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets/video-pipeline:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
